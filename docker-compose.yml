version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=lumalife
      - POSTGRES_PASSWORD=lumalife
      - POSTGRES_DB=lumalife
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumalife"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4001:8000"
    volumes:
      - app-data:/data
      - ./backend:/app
    environment:
      - DATA_DIR=/data
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://lumalife:lumalife@db:5432/lumalife
      - MIVOLO_URL=http://mivolo:8010
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mivolo:
    build:
      context: ./mivolo
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
    driver: local
  pg-data:
    driver: local
