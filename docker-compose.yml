version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=lumalife
      - POSTGRES_PASSWORD=lumalife
      - POSTGRES_DB=lumalife
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4001:8000"
    volumes:
      - app-data:/data
      - ./backend:/app
    environment:
      - DATA_DIR=/data
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://lumalife:lumalife@db:5432/lumalife
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app-data:
    driver: local
  pg-data:
    driver: local
